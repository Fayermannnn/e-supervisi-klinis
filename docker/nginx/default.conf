server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20M;

    # Sprint 11 (OWASP A05): header keamanan yang tidak bergantung pada TLS.
    # Strict-Transport-Security SENGAJA belum ditambahkan di sini - HSTS pada
    # origin yang baru melayani HTTP polos (belum ada domain publik/Let's
    # Encrypt, SDD Lampiran A #7 masih PENDING) berisiko mengunci browser dari
    # mengakses situs sama sekali sampai TLS benar-benar aktif. Tambahkan
    # HSTS bersamaan dengan konfigurasi TLS, bukan mendahuluinya.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
